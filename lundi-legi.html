<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D9E75">
<link rel="icon" type="image/png" href="assets/icons/pwa/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/pwa/apple-touch-icon.png">
<title>Pharmeval — Lundi Légi</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.30.0/tabler-icons.min.css">
<style>body{background:#0C1A18}</style>
<link rel="stylesheet" href="css/styles.css">
<style>
.ll-header-card{border-top:3px solid var(--accent-purple);}
.ll-week-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(192,132,252,.12);color:var(--accent-purple);border:1px solid rgba(192,132,252,.25);border-radius:20px;font-size:12px;font-weight:600;padding:4px 12px;margin-bottom:var(--space-2);}
.ll-question-block{background:var(--surface2);border-left:3px solid var(--accent-purple);border-radius:0 var(--radius) var(--radius) 0;padding:var(--space-3);margin:var(--space-3) 0;font-size:15px;line-height:1.6;color:var(--text);}
.ll-options{display:flex;flex-direction:column;gap:var(--space-2);}
.ll-option{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s;}
.ll-option:hover:not([disabled]){border-color:var(--accent-purple);background:rgba(192,132,252,.06);}
.ll-option-letter{width:28px;height:28px;flex-shrink:0;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text2);margin-top:1px;}
.ll-option-text{font-size:14px;color:var(--text);line-height:1.45;}
.ll-option.correct{border-color:var(--green);background:rgba(29,158,117,.08);}
.ll-option.correct .ll-option-letter{background:var(--green);color:#fff;}
.ll-option.correct .ll-option-text{color:var(--green-dark);}
.ll-option.wrong{border-color:rgba(255,255,255,.06);opacity:.55;}
.ll-option.selected-wrong{border-color:var(--red);background:rgba(226,75,74,.08);}
.ll-option.selected-wrong .ll-option-letter{background:var(--red);color:#fff;}
.ll-result-banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius);margin-bottom:var(--space-3);}
.ll-result-ok{background:rgba(29,158,117,.12);border:1px solid rgba(29,158,117,.35);}
.ll-result-ko{background:rgba(226,75,74,.12);border:1px solid rgba(226,75,74,.35);}
.ll-result-icon{font-size:28px;flex-shrink:0;}
.ll-result-title{font-size:15px;font-weight:700;margin-bottom:2px;}
.ll-result-sub{font-size:12px;color:var(--text2);}
.ll-expl{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-3);margin-top:var(--space-3);}
.ll-expl-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:var(--space-2);}
.ll-expl-text{font-size:13px;color:var(--text2);line-height:1.6;}
.ll-source{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--text2);}
.ll-archive-link{display:inline-flex;align-items:center;gap:6px;margin-top:var(--space-3);font-size:13px;color:var(--accent-purple);font-weight:500;}
.ll-archive-link i{font-size:15px;}
.ll-out-of-season{text-align:center;padding:var(--space-5) var(--space-3);}
.ll-out-of-season-icon{font-size:48px;color:var(--accent-purple);margin-bottom:var(--space-3);}
</style>
</head>
<body>

<div id="ll-loading" class="app-loading"><img class="app-loading-logo" src="assets/brand/pharmeval-mark.png" alt="" width="64" height="64"></div>

<div id="site-header-mount"></div>

<div id="ll-view" class="bank-page" style="display:none;max-width:760px;">
  <div class="card ll-header-card" style="margin-bottom:var(--space-3);">
    <h2 style="margin-bottom:4px;"><span class="page-header-icon" style="background:rgba(192,132,252,.15);color:var(--accent-purple);"><i class="ti ti-gavel" aria-hidden="true"></i></span> Lundi Légi</h2>
    <p class="import-intro" style="margin:0;">Une question de droit et de déontologie pharmaceutique, chaque lundi.</p>
  </div>

  <div id="ll-message" class="admin-message" style="display:none;"></div>
  <div id="ll-card" class="card"></div>
</div>

<script type="module" src="js/lundi-legi.js"></script>
<script src="js/sw-register.js"></script>

</body>
</html>
