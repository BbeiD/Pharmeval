<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D9E75">
<link rel="icon" type="image/png" href="assets/icons/pwa/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/pwa/apple-touch-icon.png">
<title>Pharmeval — Défi du jour</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.30.0/tabler-icons.min.css">
<style>body{background:#0C1A18}</style>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="defi-loading" class="app-loading"><img class="app-loading-logo" src="assets/brand/pharmeval-mark.png" alt="" width="64" height="64"></div>

<div id="site-header-mount"></div>

<div id="defi-view" class="bank-page" style="display:none;max-width:840px;">

  <!-- EN-TÊTE compact -->
  <div class="card defi-page-header-card" style="margin-bottom:var(--space-3);border-top:3px solid var(--accent-orange);">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span class="page-header-icon page-header-icon-orange"><i class="ti ti-flame" aria-hidden="true"></i></span>
      <div>
        <h2 style="margin:0 0 2px;">Défi du jour</h2>
        <p class="defi-header-sub" id="defi-header-sub">Cinq questions. Le même défi pour tous.</p>
      </div>
    </div>
  </div>

  <div id="defi-message" class="admin-message" style="display:none;"></div>

  <div id="defi-card" class="card" style="border-top:3px solid var(--accent-orange);"></div>
</div>

<script type="module" src="js/defi.js"></script>

<script src="js/sw-register.js"></script>

</body>
</html>
