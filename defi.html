<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D9E75">
<link rel="icon" type="image/png" href="assets/icons/pwa/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/pwa/apple-touch-icon.png">
<title>Pharmeval — Défi du jour</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.30.0/tabler-icons.min.css">

<body>

<div id="defi-loading" class="app-loading"><img class="app-loading-logo" src="assets/brand/pharmeval-mark.png" alt=""></div>

<div id="site-header-mount"></div>

<div id="defi-view" class="bank-page" style="display:none;max-width:760px;">
  <div class="card home-welcome-card" style="margin-bottom:var(--space-3);border-top:3px solid var(--accent-orange);">
    <div class="home-welcome-text">
      <h2 style="margin-bottom:4px;"><span class="page-header-icon page-header-icon-orange"><img src="assets/icons/nav/defi.png" alt="" aria-hidden="true"></span> Défi du jour</h2>

    </div>
  </div>

  <div id="defi-message" class="admin-message" style="display:none;"></div>

  <div id="defi-card" class="card" style="border-top:3px solid var(--accent-orange);"></div>
</div>

<script type="module" src="js/defi.js"></script>

<script src="js/sw-register.js"></script>
