<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D9E75">
<link rel="icon" type="image/png" href="assets/icons/pwa/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/pwa/apple-touch-icon.png">
<title>Pharmeval — Mes parcours</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.30.0/tabler-icons.min.css">

<body>

<div id="mesparcours-loading">Chargement…</div>

<div id="site-header-mount"></div>

<div id="mesparcours-view" class="bank-page" style="display:none;">
  <div class="card home-welcome-card" style="margin-bottom:var(--space-4);">
    <div class="home-welcome-text">
      <h2 style="margin-bottom:4px;"><img src="assets/icons/nav/mes-parcours.png" alt="" aria-hidden="true" style="width:22px;height:22px;vertical-align:-6px;"> Mes parcours</h2>

  </div>

  <div class="stat-card-grid" id="mesparcours-stats-grid" style="margin-bottom:var(--space-4);"></div>

  <div id="mesparcours-message" class="admin-message" style="display:none;"></div>

  <div class="card">
    <div id="mesparcours-tabs" class="bank-tabs"></div>

    <div id="mesparcours-empty" class="bank-list-empty" style="display:none;"></div>
