<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D9E75">
<link rel="icon" type="image/png" href="assets/icons/pwa/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/pwa/apple-touch-icon.png">
<title>Pharmeval — Mes parcours</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.30.0/tabler-icons.min.css">
<style>body{background:#0C1A18}</style>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="mesparcours-loading" class="app-loading"><img class="app-loading-logo" src="assets/brand/pharmeval-mark.png" alt="" width="64" height="64"></div>

<div id="site-header-mount"></div>

<div id="mesparcours-view" class="bank-page" style="display:none;">
  <div class="card home-welcome-card" style="margin-bottom:var(--space-3);border-top:3px solid var(--accent-blue);">
    <div class="home-welcome-text">
      <h2 style="margin-bottom:4px;"><span class="page-header-icon page-header-icon-blue"><i class="ti ti-route" aria-hidden="true"></i></span> Mes parcours</h2>
      <p class="import-intro" style="margin:0;">Testez-vous sur des thèmes spécifiques, à votre rythme.</p>
    </div>
  </div>

  <div class="stat-card-grid" id="mesparcours-stats-grid" style="margin-bottom:var(--space-3);"></div>

  <div id="mesparcours-message" class="admin-message" style="display:none;"></div>

  <!-- AJOUT (demande directe de David, 29/07/2026, capture d'un module
       "Navigation" a onglets fourni en reference) : "Mes parcours"/"Mon
       organisation" sont desormais de vrais onglets "en fiche cartonnee" -
       accroches au-dessus du panneau (folder-tabs), l'onglet actif se
       fond visuellement avec le panneau (meme couleur de fond), les
       inactifs restent en retrait - plutot que des pilules identiques
       aux filtres de statut juste en-dessous (Toutes/En cours/...),
       jusqu'ici visuellement indiscernables des deux. -->
  <div id="mesparcours-top-tabs" class="folder-tabs"></div>
  <div class="card mesparcours-panel">
    <div id="mesparcours-tabs" class="bank-tabs" style="margin-bottom:var(--space-3);"></div>

    <div id="mesparcours-empty" class="bank-list-empty" style="display:none;"></div>

    <div id="mesparcours-grid" class="mesparcours-grid"></div>
  </div>
</div>

<script type="module" src="js/mes-parcours.js"></script>

<script src="js/sw-register.js"></script>

</body>
</html>
