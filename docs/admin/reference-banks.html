<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1D9E75">
<link rel="icon" type="image/png" href="../assets/icons/pwa/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/icons/pwa/apple-touch-icon.png">
<title>Pharmeval — Organisations et accès</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.30.0/tabler-icons.min.css">
<style>body{background:#080F0E}</style>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div id="refbanks-loading" class="app-loading"><img class="app-loading-logo" src="../assets/brand/pharmeval-mark.png" alt="" width="64" height="64"></div>

<div id="refbanks-denied" style="display:none;">
  <div class="adm-modal" style="max-width:480px;margin:60px auto;">
    <h2>Accès refusé</h2>
    <p>La gestion des données de référence est réservée aux administrateurs.</p>
    <div class="btn-row"><a class="btn-primary" href="../index.html">Retour à l'accueil</a></div>
  </div>
</div>

<div id="site-header-mount"></div>

<div id="refbanks-view" style="display:none;">
  <div class="adm-content">
    <div class="adm-page-header">
      <div>
        <h1 class="adm-page-title" id="refbanks-title"><i class="ti ti-building" aria-hidden="true"></i> Organisations et accès</h1>
        <p class="adm-page-subtitle" id="refbanks-subtitle" style="margin:2px 0 0;font-size:13px;color:var(--text2);">Gérez vos organisations, profils d'accès et groupes d'utilisateurs.</p>
      </div>
      <div class="adm-page-actions">
        <button class="btn-primary" id="refbanks-create-btn" onclick="openCreateForm()">+ Nouvelle organisation</button>
      </div>
    </div>

    <!-- Onglets navigation -->
    <div class="adm-tabs" style="padding-left:0;padding-right:0;margin-bottom:16px;">
      <button class="adm-tab" id="refbanks-tab-organizations" onclick="switchBank('organizations')" role="tab" aria-selected="false">
        Organisations <span id="refbanks-count-organizations" class="adm-nav-badge" style="display:none;font-size:11px;"></span>
      </button>
      <button class="adm-tab" id="refbanks-tab-profiles" onclick="switchBank('profiles')" role="tab" aria-selected="false">
        Profils <span id="refbanks-count-profiles" class="adm-nav-badge" style="display:none;font-size:11px;"></span>
      </button>
      <button class="adm-tab" id="refbanks-tab-groups" onclick="switchBank('groups')" role="tab" aria-selected="false">
        Groupes <span id="refbanks-count-groups" class="adm-nav-badge" style="display:none;font-size:11px;"></span>
      </button>
    </div>

    <div id="refbanks-message" class="adm-message" style="display:none;"></div>

    <div class="adm-toolbar">
      <input type="text" id="refbanks-search-input" class="adm-search"
             placeholder="Rechercher (nom, description)…" oninput="onSearchInput()">
      <select id="refbanks-filter-status" class="bank-select" onchange="onFilterChange()">
        <option value="">Statut : Tous</option>
        <option value="draft">🟡 Brouillon</option>
        <option value="published">🟢 Publié</option>
        <option value="archived">⚫ Archivé</option>
        <option value="trash">🔴 Corbeille</option>
      </select>
      <select id="refbanks-sort-field" class="bank-select" onchange="onFilterChange()">
        <option value="createdAt">Trier : Date de création</option>
        <option value="updatedAt">Date de modification</option>
        <option value="name">Nom</option>
      </select>
      <button class="btn-secondary bank-sort-dir-btn" id="refbanks-sort-dir-btn" onclick="toggleSortDirection()" title="Inverser l'ordre"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="12" y1="4" x2="12" y2="19"/><polyline points="6,13 12,19 18,13"/></svg></button>
    </div>

    <div id="refbanks-search-disclaimer" class="admin-users-disclaimer" style="display:none;"></div>

    <div id="refbanks-create-card" class="bank-detail-card" style="display:none; margin-bottom:16px;">
      <h3 id="refbanks-create-title">Nouvel élément</h3>
      <div id="refbanks-create-suggestions" style="margin-bottom:8px;"></div>
      <label class="bank-edit-label">Nom</label>
      <input type="text" id="refbanks-create-name" class="bank-select" placeholder="Nom">
      <label class="bank-edit-label">Description</label>
      <textarea id="refbanks-create-description" class="bank-edit-textarea"></textarea>
      <div id="refbanks-create-extra"></div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="closeCreateForm()">Annuler</button>
        <button class="btn-primary" onclick="submitCreate()">Créer</button>
      </div>
    </div>

    <div class="adm-split">
      <div class="adm-split-list">
        <div id="refbanks-list-empty" class="bank-list-empty" style="display:none;"></div>
        <div id="refbanks-list" class="adm-table-wrap" style="margin-bottom:8px;"></div>
        <div id="refbanks-pagination" class="bank-pagination"></div>
      </div>
      <div class="adm-split-detail">
        <div id="refbanks-detail-placeholder" class="adm-detail-placeholder">Sélectionnez un élément dans la liste pour afficher sa fiche.</div>
        <div id="refbanks-detail" class="bank-detail" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="reference-banks.js"></script>

<script src="../js/sw-register.js"></script>

</body>
</html>
