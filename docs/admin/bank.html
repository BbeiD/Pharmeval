<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1D9E75">
<link rel="icon" type="image/png" href="../assets/icons/pwa/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/icons/pwa/apple-touch-icon.png">
<title>Pharmeval — Banque de questions</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.30.0/tabler-icons.min.css">
<style>body{background:#080F0E}</style>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div id="bank-loading" class="app-loading"><img class="app-loading-logo" src="../assets/brand/pharmeval-mark.png" alt="" width="64" height="64"></div>

<div id="bank-denied" style="display:none;">
  <div class="adm-modal" style="max-width:480px;margin:60px auto;">
    <h2>Accès refusé</h2>
    <p>La banque de questions est réservée aux administrateurs.</p>
    <div class="btn-row">
      <a class="btn-primary" href="../index.html">Retour à l'accueil</a>
    </div>
  </div>
</div>

<div id="site-header-mount"></div>

<div id="bank-view" style="display:none;">
  <div class="adm-content">
    <div class="adm-page-header">
      <h1 class="adm-page-title"><i class="ti ti-help" aria-hidden="true"></i> Banque de questions</h1>
      <div class="adm-page-actions">
        <a href="import-corrections.html" class="btn-secondary">Importer corrections</a>
        <button id="bank-export-btn" class="btn-secondary" onclick="downloadQuestionsCSV()">Exporter CSV</button>
        <button class="btn-primary" onclick="requestBulkPublish()"><i class="ti ti-circle-check" aria-hidden="true"></i> Publier les brouillons</button>
      </div>
    </div>

    <div id="bank-message" class="adm-message" style="display:none;"></div>

    <div class="adm-toolbar">
      <input type="text" id="bank-search-input" class="adm-search"
             placeholder="Rechercher (identifiant, question, thème, sous-thème, tags, source)…"
             oninput="onBankSearchInput()">
    </div>

    <div id="bank-search-disclaimer" class="admin-users-disclaimer" style="display:none;"></div>

    <div id="bank-list-empty" class="bank-list-empty" style="display:none;"></div>
    <div id="bank-list" class="bank-list"></div>
    <div id="bank-pagination" class="bank-pagination"></div>

    <div id="bank-detail-placeholder" class="adm-detail-placeholder" style="margin-top:16px;">
      Sélectionnez une question dans la liste pour afficher sa fiche complète.
    </div>
    <div id="bank-detail" class="bank-detail" style="display:none; margin-top:16px;"></div>
  </div>
</div>

<script type="module" src="bank.js"></script>

<script src="../js/sw-register.js"></script>

</body>
</html>
