<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D9E75">
<link rel="icon" type="image/png" href="assets/icons/pwa/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/pwa/apple-touch-icon.png">
<title>Pharmeval — Mon profil</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.30.0/tabler-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="mp-loading" class="app-loading"><img class="app-loading-logo" src="assets/brand/pharmeval-mark.png" alt="" width="64" height="64"></div>

<div id="site-header-mount"></div>

<div id="mp-view" class="bank-page" style="display:none;">
  <div class="bank-header">
    <h2><i class="ti ti-user" aria-hidden="true" style="font-size:22px;vertical-align:-4px;"></i> Mon profil</h2>
  </div>

  <!-- AJOUT (refonte visuelle, phase 1) : version VOLONTAIREMENT MINIMALE
       - affichage en lecture seule des informations reelles deja
       existantes (fiche utilisateur + profil declare a l'onboarding).
       Reportes a plus tard (decision prise avec David, pas de la donnee
       inventee ici pour combler) : photo de profil (aucun chemin d'upload
       n'existe aujourd'hui), onglets Preferences/Securite, "Vos badges"
       (aucun systeme de badges n'existe). -->
  <div class="card" style="max-width:640px;">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:var(--space-3);">
      <div id="mp-avatar" class="mp-avatar"></div>
      <div>
        <h3 id="mp-name" style="margin:0;"></h3>
        <p id="mp-email" class="pv-list-empty" style="margin:0;"></p>
      </div>
    </div>

    <div class="bank-detail-section">
      <h4>Informations</h4>
      <div class="bank-detail-row"><strong>Profession :</strong> <span id="mp-profession"></span></div>
      <div class="bank-detail-row"><strong>Organisation :</strong> <span id="mp-organization"></span></div>
      <div class="bank-detail-row"><strong>Membre depuis :</strong> <span id="mp-member-since"></span></div>
    </div>
  </div>

  <!-- AJOUT (refonte visuelle, phase 3 - mockup mobile ideal fourni par
       David, 27/07/2026) : donnees REELLES deja calculees ailleurs
       (js/home.js, meme services) - jamais un chiffre invente pour
       remplir la tuile. -->
  <div class="stat-card-grid" id="mp-stats-grid" style="max-width:640px;margin-top:var(--space-4);"></div>

  <!-- AJOUT : "Mon profil" devient le point d'acces pour tout ce qui n'a
       plus sa place dans la barre de navigation (reduite a 5 icones,
       voir js/site-header.js) - UNIQUEMENT des destinations REELLES et
       deja fonctionnelles (jamais de ligne "Favoris"/"Paramètres" qui ne
       menerait nulle part - meme principe que la version minimale
       ci-dessus, deja documente). -->
  <div class="card" id="mp-menu-card" style="max-width:640px;margin-top:var(--space-4);">
    <div id="mp-menu-list"></div>
  </div>

  <p style="max-width:640px;margin-top:var(--space-4);text-align:center;font-size:11px;color:var(--text2);opacity:.5;">
    <a href="cgu.html" style="color:inherit;text-decoration:none;">Conditions d'utilisation &amp; confidentialité</a>
  </p>
</div>

<script type="module" src="js/mon-profil.js"></script>

<script src="js/sw-register.js"></script>

</body>
</html>
